name: FoodFinder
entities:
  User:
    authenticable: true
    properties:
      - name
      - { name: email, type: email }
      - { name: role, type: choice, options: { values: [admin, diner], default: diner } }
    policies:
      create:
        - access: admin
      read:
        - { access: restricted, allow: User, condition: self }
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - access: admin
      signup:
        - access: public

  Restaurant:
    properties:
      - name
      - { name: description, type: text }
      - { name: cuisine, type: choice, options: { values: [Italian, Mexican, Japanese, American, Indian] } }
      - { name: photo, type: image, options: { sizes: { thumbnail: { width: 400, height: 300 }, medium: { width: 800, height: 600 } } } }
    belongsTo:
      - { name: addedBy, entity: User }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - access: public
      update:
        - access: admin
      delete:
        - access: admin

  Review:
    properties:
      - { name: rating, type: number, options: { min: 1, max: 5 } }
      - { name: comment, type: text }
    belongsTo:
      - { name: author, entity: User }
      - { name: restaurant, entity: Restaurant }
    policies:
      create:
        - { access: restricted, allow: User }
      read:
        - access: public
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - { access: restricted, allow: User, condition: self }

# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck